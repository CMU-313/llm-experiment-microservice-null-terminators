name: Run Tests

on:
  push:
    branches:
      - f25
  pull_request:
    branches:
      - f25

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_ENV: 'production'

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: pip install uv

      - name: Install Dependencies
        run: uv init && uv add -r requirements.txt

      - name: Run tests
        run: uv run pytest